name: Repository maintenance
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finalize repository
        shell: bash
        env:
          HFH_FIGURE_00: ""
          HFH_FIGURE_01: ""
          HFH_FIGURE_02: ""
          HFH_FIGURE_03: ""
          HFH_FIGURE_04: ""
          HFH_FIGURE_05: ""
          HFH_FIGURE_06: ""
          HFH_FIGURE_07: ""
          HFH_FIGURE_08: ""
          HFH_FIGURE_09: ""
          HFH_FIGURE_10: ""
          HFH_FIGURE_11: ""
          HFH_FIGURE_12: ""
          HFH_FIGURE_13: ""
        run: |
          set -euo pipefail
          source_commit=019e86fb4f4bc46cd6b6516f051f824c124fa419
          original_head=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$source_commit" HEAD
          test "$(git diff --name-only "$source_commit" HEAD)" = ".github/workflows/repository-maintenance.yml"
          rm RECOVERY.md assets/README.md .github/workflows/repository-maintenance.yml
          printf '%s' '' | base64 --decode > README.md
          python3 - <<'PYFIGURE'
          import base64, os
          from pathlib import Path
          Path('assets/SCH-category.jpg').write_bytes(base64.b64decode(''.join(os.environ[f'HFH_FIGURE_{i:02d}'] for i in range(14))))
          PYFIGURE
          printf '%s  %s\n' '568d1682ae221380960eee4d791c8b30ce2509268e222d9188d8a55b92fbd744' 'assets/SCH-category.jpg' | sha256sum --check
          git add -A
          test "$(git write-tree)" = "bf804a1f368002a1c42729dcf8964b8a5232bb88"
          git config user.name 'FatShion'
          git config user.email '48754270+FatShion-FTD@users.noreply.github.com'
          clean_commit=$(git commit-tree bf804a1f368002a1c42729dcf8964b8a5232bb88 -m 'Initial commit')
          test -z "$(git show --no-patch --format=%P "$clean_commit")"
          git push --force-with-lease="refs/heads/main:$original_head" origin "$clean_commit:refs/heads/main"
          printf 'Main now points to %s\n' "$clean_commit"
