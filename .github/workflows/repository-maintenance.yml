name: Repository maintenance
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finalize repository
        shell: bash
        run: |
          set -euo pipefail
          source_commit=019e86fb4f4bc46cd6b6516f051f824c124fa419
          original_head=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$source_commit"
          test "$(git diff --name-only "$source_commit" HEAD)" = ".github/workflows/repository-maintenance.yml"
          rm RECOVERY.md assets/README.md .github/workflows/repository-maintenance.yml
          printf '%s' '' | base64 --decode > README.md
          curl --fail --location --retry 2 --max-time 60 'https://github.com/user-attachments/assets/bdc2838c-5b5b-40fb-b2b0-ab8b069ed50f' --output assets/SCH-category.png
          printf '%s  %s\n' '607059ecad77ac5a394a47c45757d423a99684433d2b5076b0d78c90ef5ee9f7' 'assets/SCH-category.png' | sha256sum --check
          git add -A
          test "$(git write-tree)" = "8112f7e1d0c2fb3bd75bec2731200655ebc3e268"
          git config user.name 'FatShion'
          git config user.email '48754270+FatShion-FTD@users.noreply.github.com'
          clean_commit=$(git commit-tree 8112f7e1d0c2fb3bd75bec2731200655ebc3e268 -m 'Initial commit')
          test -z "$(git show --no-patch --format=%P "$clean_commit")"
          git push --force-with-lease="refs/heads/main:$original_head" origin "$clean_commit:refs/heads/main"
          printf 'Main now points to %s\n' "$clean_commit"
